[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-quaternion-rotation-slerp-skill"
version = "1.0.0"
description = "Unit quaternion 3D orientation engine with Hamiltonian multiplication, vector rotation, and SLERP interpolation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Rendering"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-quaternion-rotation-slerp-skill"
Repository = "https://github.com/alphaparkinc/genpark-quaternion-rotation-slerp-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-quaternion-rotation-slerp-skill/issues"
